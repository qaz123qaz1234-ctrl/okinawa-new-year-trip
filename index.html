<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>沖繩跨年 5 天 4 夜 行程手冊</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0284c7" />

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Google Firebase App & Firestore Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    window.FirebaseModule = {
      initializeApp,
      getAuth,
      signInAnonymously,
      getFirestore,
      doc,
      setDoc,
      onSnapshot
    };
  </script>

  <style>
    body {
      -webkit-tap-highlight-color: transparent;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .carousel-track {
      display: flex;
      width: 100%;
      transition: transform 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
      will-change: transform;
    }
    .carousel-slide {
      flex: 0 0 100%;
      width: 100%;
      min-width: 100%;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-20">

  <!-- Sticky Top Header -->
  <header class="sticky top-0 z-50 bg-gradient-to-r from-sky-700 via-sky-600 to-indigo-700 text-white shadow-md">
    <div class="max-w-md mx-auto px-4 pt-3 pb-2.5">
      <div class="flex items-center justify-between">
        <div>
          <h1 class="text-base font-bold tracking-tight flex items-center gap-1.5">
            <span>沖繩跨年 5 天 4 夜</span>
            <span id="sync-status-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse" title="已連線同步"></span>
          </h1>
          <p class="text-[11px] text-sky-100">12/30 (二) ～ 01/03 (六)・自駕漫遊手冊</p>
        </div>

        <!-- Action Tools -->
        <div class="flex items-center gap-1.5">
          <!-- Split Expenses Link Button -->
          <a href="split.html" class="px-2 py-1 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold shadow-sm flex items-center gap-1 active:scale-95 transition" title="前往旅費分帳本">
            <i data-lucide="receipt" class="w-3.5 h-3.5"></i>
            <span>分帳 ↗</span>
          </a>

          <!-- Exchange Rate Calculator Button -->
          <button onclick="openRateCalculatorModal()" class="px-2 py-1 rounded-xl bg-white/20 hover:bg-white/30 text-white text-xs font-bold flex items-center gap-1 active:scale-95 transition" title="匯率計算機">
            <i data-lucide="calculator" class="w-3.5 h-3.5 text-amber-300"></i>
            <span>計算機</span>
          </button>

          <!-- Admin Lock / Unlock Toggle -->
          <button id="admin-toggle-btn" onclick="toggleAdminMode()" class="p-1.5 rounded-xl bg-white/20 hover:bg-white/30 text-white active:scale-95 transition" title="管理員設定">
            <i data-lucide="lock" class="w-3.5 h-3.5" id="admin-lock-icon"></i>
          </button>

          <!-- Reset Schedule Button -->
          <button onclick="requestResetSchedule()" class="p-1.5 rounded-xl bg-white/20 hover:bg-rose-500 text-white active:scale-95 transition" title="重設行程">
            <i data-lucide="rotate-ccw" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      </div>

      <!-- Navigation Tabs (Simplified: D1 ~ D5, 未排入, 全部) -->
      <nav class="flex items-center gap-1.5 overflow-x-auto hide-scrollbar mt-2.5 pt-0.5 text-xs font-semibold">
        <button onclick="switchTab(0)" class="tab-btn px-3 py-1.5 rounded-xl bg-white text-sky-800 shadow-sm shrink-0 transition" data-index="0">D1</button>
        <button onclick="switchTab(1)" class="tab-btn px-3 py-1.5 rounded-xl text-sky-100 hover:bg-white/10 shrink-0 transition" data-index="1">D2</button>
        <button onclick="switchTab(2)" class="tab-btn px-3 py-1.5 rounded-xl text-sky-100 hover:bg-white/10 shrink-0 transition" data-index="2">D3</button>
        <button onclick="switchTab(3)" class="tab-btn px-3 py-1.5 rounded-xl text-sky-100 hover:bg-white/10 shrink-0 transition" data-index="3">D4</button>
        <button onclick="switchTab(4)" class="tab-btn px-3 py-1.5 rounded-xl text-sky-100 hover:bg-white/10 shrink-0 transition" data-index="4">D5</button>
        <button onclick="switchTab(5)" class="tab-btn px-3 py-1.5 rounded-xl text-amber-200 hover:bg-white/10 shrink-0 transition flex items-center gap-1" data-index="5">
          <i data-lucide="bookmark" class="w-3 h-3"></i>
          <span>未排入</span>
        </button>
        <button onclick="switchTab(6)" class="tab-btn px-3 py-1.5 rounded-xl text-sky-100 hover:bg-white/10 shrink-0 transition flex items-center gap-1" data-index="6">
          <i data-lucide="list" class="w-3 h-3"></i>
          <span>全部清單</span>
        </button>
      </nav>
    </div>
  </header>

  <!-- Visitor Mode Reminder Banner -->
  <div id="visitor-preview-banner" class="max-w-md mx-auto px-4 mt-2 hidden">
    <div class="bg-amber-50 border border-amber-200 text-amber-800 text-[11px] p-2 rounded-2xl flex items-center justify-between gap-1 shadow-sm">
      <div class="flex items-center gap-1.5 truncate">
        <i data-lucide="info" class="w-3.5 h-3.5 text-amber-600 shrink-0"></i>
        <span class="truncate">目前為本機暫存預覽，重新整理即恢復雲端設定</span>
      </div>
      <button onclick="reloadFromCloud()" class="underline font-bold text-amber-900 shrink-0">立即還原</button>
    </div>
  </div>

  <!-- Main Carousel Container -->
  <main class="max-w-md mx-auto overflow-hidden mt-2">
    <div id="carousel-track" class="carousel-track">
      <!-- Slide 0: Day 1 -->
      <div class="carousel-slide px-4" id="slide-d1"></div>
      <!-- Slide 1: Day 2 -->
      <div class="carousel-slide px-4" id="slide-d2"></div>
      <!-- Slide 2: Day 3 -->
      <div class="carousel-slide px-4" id="slide-d3"></div>
      <!-- Slide 3: Day 4 -->
      <div class="carousel-slide px-4" id="slide-d4"></div>
      <!-- Slide 4: Day 5 -->
      <div class="carousel-slide px-4" id="slide-d5"></div>
      <!-- Slide 5: 未排入景點 -->
      <div class="carousel-slide px-4" id="slide-unscheduled"></div>
      <!-- Slide 6: 全部景點清單 -->
      <div class="carousel-slide px-4" id="slide-all-places"></div>
    </div>
  </main>

  <!-- Modals -->

  <!-- Live Exchange Rate Calculator Modal -->
  <div id="rate-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto text-xs">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="p-2 rounded-xl bg-amber-100 text-amber-700">
            <i data-lucide="calculator" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-base text-slate-800">即時匯率換算機</h3>
            <p class="text-[11px] text-slate-400">日幣 JPY ⇄ 台幣 TWD</p>
          </div>
        </div>
        <button onclick="closeRateModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Current Exchange Rate Card -->
      <div class="bg-gradient-to-br from-amber-50 to-orange-50 border border-amber-200/80 rounded-2xl p-3 flex items-center justify-between">
        <div>
          <span class="text-[10px] text-amber-800 font-bold block">國際牌告即時匯率</span>
          <span class="text-lg font-black text-amber-900">1 JPY ≈ <span id="modal-rate-display">0.215</span> TWD</span>
        </div>
        <button onclick="fetchLiveExchangeRate(true)" class="p-2 rounded-xl bg-white shadow-sm border border-amber-200 text-amber-800 hover:bg-amber-100 active:scale-95 transition" title="重新整理匯率">
          <i data-lucide="refresh-cw" class="w-4 h-4" id="modal-rate-refresh-icon"></i>
        </button>
      </div>

      <!-- Live Convert Inputs -->
      <div class="space-y-3">
        <div>
          <label class="font-bold text-slate-700 block mb-1">日幣金額 (¥ JPY)</label>
          <div class="relative">
            <input type="number" id="calc-input-jpy" inputmode="decimal" placeholder="0" oninput="convertJpyToTwd()"
                   class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 text-base focus:ring-2 focus:ring-sky-500 pl-8" />
            <span class="absolute left-3 top-2.5 font-bold text-slate-400 text-sm">¥</span>
          </div>
        </div>

        <!-- Quick Pill Suggestions -->
        <div class="flex items-center gap-1.5 flex-wrap">
          <button onclick="quickSetJpy(1000)" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-bold text-slate-700">¥1,000</button>
          <button onclick="quickSetJpy(3000)" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-bold text-slate-700">¥3,000</button>
          <button onclick="quickSetJpy(5000)" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-bold text-slate-700">¥5,000</button>
          <button onclick="quickSetJpy(10000)" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-bold text-slate-700">¥1萬</button>
          <button onclick="quickSetJpy(30000)" class="px-2 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 text-[11px] font-bold text-slate-700">¥3萬</button>
        </div>

        <div>
          <label class="font-bold text-slate-700 block mb-1">折合新台幣 (NT$ TWD)</label>
          <div class="relative">
            <input type="number" id="calc-input-twd" inputmode="decimal" placeholder="0" oninput="convertTwdToJpy()"
                   class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 text-base focus:ring-2 focus:ring-sky-500 pl-10" />
            <span class="absolute left-3 top-2.5 font-bold text-slate-400 text-xs">NT$</span>
          </div>
        </div>

        <!-- Credit Card Fee Estimate (+1.5%) -->
        <div class="p-3 rounded-2xl bg-slate-50 border border-slate-200/80 space-y-1">
          <div class="flex items-center justify-between">
            <span class="font-semibold text-slate-600">海外刷卡手續費 (+1.5%)</span>
            <span class="font-bold text-slate-900" id="calc-card-fee-display">NT$ 0</span>
          </div>
          <div class="flex items-center justify-between text-[11px] text-slate-400">
            <span>刷卡總計預估：</span>
            <span class="font-bold text-sky-700" id="calc-card-total-display">NT$ 0</span>
          </div>
        </div>
      </div>

      <div class="pt-1">
        <button type="button" onclick="closeRateModal()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold rounded-xl active:scale-95 transition">關閉計算機</button>
      </div>
    </div>
  </div>

  <!-- Admin PIN Unlock Modal -->
  <div id="admin-pin-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs shadow-2xl space-y-3.5 text-xs text-center">
      <div class="w-10 h-10 rounded-2xl bg-sky-100 text-sky-700 flex items-center justify-center mx-auto">
        <i data-lucide="shield-check" class="w-5 h-5"></i>
      </div>
      <div>
        <h3 class="font-bold text-base text-slate-800">管理員解鎖</h3>
        <p class="text-[11px] text-slate-400">請輸入 4 位數管理員密碼以啟用編輯權限</p>
      </div>
      <div>
        <input type="password" id="admin-pin-input" maxlength="4" placeholder="••••"
               class="w-full text-center tracking-widest text-lg py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-black text-slate-800 focus:ring-2 focus:ring-sky-500" />
      </div>
      <div class="flex items-center gap-2 pt-1">
        <button type="button" onclick="closeAdminPinModal()" class="w-1/2 py-2 bg-slate-100 text-slate-600 font-bold rounded-xl">取消</button>
        <button type="button" onclick="verifyAdminPin()" class="w-1/2 py-2 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow active:scale-95 transition">解鎖</button>
      </div>
    </div>
  </div>

  <!-- Custom Reset Modal -->
  <div id="reset-confirm-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-xs shadow-2xl space-y-3 text-xs text-center">
      <div class="w-10 h-10 rounded-2xl bg-rose-100 text-rose-600 flex items-center justify-center mx-auto">
        <i data-lucide="alert-triangle" class="w-5 h-5"></i>
      </div>
      <h3 class="font-bold text-base text-slate-800">確定重設行程？</h3>
      <p class="text-slate-500 text-[11px] leading-relaxed" id="reset-modal-desc">
        行程資料將還原為系統初始預設版本，且同步更新至雲端資料庫。
      </p>
      <div class="flex items-center gap-2 pt-2">
        <button type="button" onclick="closeResetConfirmModal()" class="w-1/2 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl">取消</button>
        <button type="button" onclick="executeResetSchedule()" class="w-1/2 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow active:scale-95 transition">確認重設</button>
      </div>
    </div>
  </div>

  <!-- Schedule Spot Placement / Replacement Modal -->
  <div id="schedule-spot-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto text-xs">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-2">
          <div class="p-2 rounded-xl bg-sky-100 text-sky-700">
            <i data-lucide="calendar-plus" class="w-5 h-5"></i>
          </div>
          <div>
            <h3 class="font-bold text-base text-slate-800">排入行程</h3>
            <p class="text-[11px] text-slate-400" id="schedule-modal-spot-name">景點名稱</p>
          </div>
        </div>
        <button onclick="closeScheduleModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-3">
        <!-- Target Day Select -->
        <div>
          <label class="font-bold text-slate-700 block mb-1">選擇目標天數</label>
          <select id="schedule-target-day" onchange="onScheduleTargetDayChange()" class="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800">
            <option value="0">Day 1（12/30・那霸市區單軌漫遊）</option>
            <option value="1">Day 2（12/31・新都心取車・初詣祈福・入住中部）</option>
            <option value="2">Day 3（01/01・元旦北部海景路線）</option>
            <option value="3">Day 4（01/02・海中道路・古民家・PARCO CITY 採買日）</option>
            <option value="4">Day 5（01/03・南部海島秘境・還車返台）</option>
          </select>
        </div>

        <!-- Mode Select: Insert vs Replace -->
        <div>
          <label class="font-bold text-slate-700 block mb-1">排程模式</label>
          <div class="grid grid-cols-2 gap-2">
            <button type="button" id="mode-btn-insert" onclick="setScheduleMode('insert')" class="py-2 rounded-xl border border-sky-600 bg-sky-50 text-sky-700 font-bold">➕ 插入並順延</button>
            <button type="button" id="mode-btn-replace" onclick="setScheduleMode('replace')" class="py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-bold">🔄 替換現有景點</button>
          </div>
        </div>

        <!-- Replace Dropdown (Visible only in replace mode) -->
        <div id="replace-spot-group" class="hidden">
          <label class="font-bold text-slate-700 block mb-1">要被替換的現有景點</label>
          <select id="schedule-replace-target" onchange="onReplaceTargetSpotChange()" class="w-full p-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800">
            <!-- Dynamically populated -->
          </select>
          <p class="text-[10px] text-amber-600 mt-1">※ 被替換的景點將自動回存至「未排入景點」中供日後選擇。</p>
        </div>

        <!-- Time Range Input with Auto-Import Button -->
        <div>
          <div class="flex items-center justify-between mb-1">
            <label class="font-bold text-slate-700">預計時段</label>
            <button type="button" id="btn-import-replaced-time" onclick="importReplacedSpotTime()" class="text-[11px] font-bold text-sky-600 hover:text-sky-700 hidden flex items-center gap-0.5">
              <i data-lucide="clock" class="w-3 h-3"></i>
              <span>帶入現有景點時段</span>
            </button>
          </div>
          <input type="text" id="schedule-spot-time" placeholder="例如：11:00 - 12:30"
                 class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800 focus:ring-2 focus:ring-sky-500" />
        </div>

        <div class="flex items-center gap-2 pt-2">
          <button type="button" onclick="closeScheduleModal()" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl">取消</button>
          <button type="button" onclick="confirmScheduleSpot()" class="w-2/3 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow active:scale-95 transition">確認排入</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Custom Spot / Edit Spot Modal -->
  <div id="edit-spot-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="bg-white rounded-3xl p-5 w-full max-w-sm shadow-2xl space-y-3 max-h-[90vh] overflow-y-auto text-xs">
      <div class="flex items-center justify-between">
        <h3 class="font-bold text-base text-slate-800" id="edit-modal-title">自訂地點資料</h3>
        <button onclick="closeEditSpotModal()" class="text-slate-400 hover:text-slate-600 p-1">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="space-y-2.5">
        <div>
          <label class="font-bold text-slate-700 block mb-1">景點 / 店家名稱 <span class="text-rose-500">*</span></label>
          <input type="text" id="edit-spot-name" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800" />
        </div>

        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="font-bold text-slate-700 block mb-1">分類標籤</label>
            <input type="text" id="edit-spot-cat" placeholder="例如：美食、景點、購物" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800" />
          </div>
          <div>
            <label class="font-bold text-slate-700 block mb-1">時間區間</label>
            <input type="text" id="edit-spot-time" placeholder="例如：12:00 - 13:30" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800" />
          </div>
        </div>

        <div>
          <label class="font-bold text-slate-700 block mb-1">Google Maps 導航連結</label>
          <input type="url" id="edit-spot-map" placeholder="https://maps.google.com/?q=..." class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl font-bold text-slate-800" />
        </div>

        <div>
          <label class="font-bold text-slate-700 block mb-1">備註 / 必吃看點</label>
          <textarea id="edit-spot-note" rows="3" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-slate-800"></textarea>
        </div>

        <div class="flex items-center gap-2 pt-2">
          <button type="button" onclick="closeEditSpotModal()" class="w-1/3 py-2.5 bg-slate-100 text-slate-600 font-bold rounded-xl">取消</button>
          <button type="button" onclick="confirmSaveSpotEdit()" class="w-2/3 py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow active:scale-95 transition">儲存資料</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast Notification -->
  <div id="notice-toast" class="fixed top-14 inset-x-0 mx-auto max-w-xs z-50 pointer-events-none transition-all duration-300 opacity-0 -translate-y-2 flex justify-center">
    <div class="bg-slate-900/95 text-white text-xs font-semibold px-4 py-2.5 rounded-2xl shadow-2xl border border-slate-700/80 flex items-center gap-2">
      <i data-lucide="info" class="w-4 h-4 text-sky-400 shrink-0"></i>
      <span id="notice-toast-text">通知訊息</span>
    </div>
  </div>

  <!-- Main JavaScript Logic -->
  <script>
    /* ==========================================================================
       1. DEFAULT SCHEDULE & DATA
       ========================================================================== */
    const DEFAULT_DAYS_DATA = [
      {
        dayNum: 1,
        date: "12/30 (二)",

    /* ==========================================================================
       2. STATE & FLIGHT SANITIZATION
       ========================================================================== */
    const STORAGE_KEY_SCHEDULE = "okinawa_schedule_v9";
    const STORAGE_KEY_UNSCHEDULED = "okinawa_unscheduled_v9";
    const STORAGE_KEY_COMPLETED = "okinawa_completed_v9";

    let CURRENT_DAYS_DATA = JSON.parse(localStorage.getItem(STORAGE_KEY_SCHEDULE) || "null") || JSON.parse(JSON.stringify(DEFAULT_DAYS_DATA));
    let CURRENT_UNSCHEDULED_PLACES = JSON.parse(localStorage.getItem(STORAGE_KEY_UNSCHEDULED) || "null") || JSON.parse(JSON.stringify(DEFAULT_UNSCHEDULED_PLACES));
    let COMPLETED_SPOTS = JSON.parse(localStorage.getItem(STORAGE_KEY_COMPLETED) || "[]");

    let currentTabIndex = 0;
    let isAdmin = false;
    let isTemporaryLocalPreview = false;
    let currentLiveRate = 0.2150;

    // Enforce exact flight information on Day 1 (CI122) and Day 5 (CI123)
    function sanitizeFlightData(days) {
      if (!Array.isArray(days) || days.length === 0) return;

      // Day 1
      if (days[0] && Array.isArray(days[0].spots)) {
        days[0].spots.forEach(spot => {
          if (!spot || !spot.name) return;
          if (spot.name.includes("CI122") || spot.name.includes("機場") || spot.name.includes("抵達")) {
            spot.time = "16:50 - 19:25";
            spot.name = "中華航空 CI122 抵達那霸機場 (OKA)";
            spot.note = "中華航空 CI122（16:50 桃園 T2 起飛 → 19:25 抵達那霸國際線航廈）。入境審查、領取行李約 20:20 完成出關，走連通道至國內線 2F 搭乘單軌電車 (Yui-Rail)。";
          }
          if (spot.name.includes("通堂")) {
            spot.time = "20:40 - 21:40";
            spot.note = "機場搭單軌僅 2 站（約 5 分）直達小祿站！免去尖峰排隊，品嚐招牌濃厚豚骨男人麵、清爽鹽味女人麵與辣豆芽（營業至 23:30）。";
          }
          if (spot.name.includes("壺川") || spot.name.includes("3 Chome")) {
            spot.time = "21:55 - 22:40";
            spot.note = "小祿站搭單軌 3 站至壺川站，步行抵達 3 Chome 辦理入住 Check-in，卸下大行李箱輕裝出發。";
          }
          if (spot.name.includes("屋台村")) {
            spot.time = "22:50 - 00:00";
            spot.note = "搭單軌至牧志站（或計程車約 8 分鐘）。聚集 20 間特色下町居酒屋，深夜氣氛正好！品嚐串燒、海葡萄與在地泡盛。";
          }
          if (spot.name.includes("MaxValu") || spot.name.includes("採買")) {
            spot.time = "00:05 - 00:50";
            spot.note = "屋台村旁 24 小時營業大型超市，採買飲用水、日本草莓水果、沖繩特產零食與消夜泡麵，採買完返回民宿休息。";
          }
        });
      }

      // Day 5
      if (days[4] && Array.isArray(days[4].spots)) {
        days[4].spots.forEach(spot => {
          if (!spot || !spot.name) return;
          if (spot.name.includes("OTS") || spot.name.includes("還車")) {
            spot.time = "15:30 - 16:00";
            spot.name = "OTS DFS 還車 (⚠️ 16:00 前還車)";
          }
          if (spot.name.includes("CI123") || spot.name.includes("返台")) {
            spot.time = "20:25 - 21:05";
            spot.name = "那霸機場・中華航空 CI123 返台";
            spot.note = "16:00 前於 OTS DFS 完成還車後搭乘單軌至機場，國內線二樓採買伴手禮。18:25 前前往國際線櫃檯辦理中華航空 CI123 報到託運（20:25 那霸起飛 → 21:05 抵達桃園）。";
          }
        });
      }
    }

    // Run sanitization immediately on load
    sanitizeFlightData(CURRENT_DAYS_DATA);

    function saveCurrentState(pushToCloudSync = true) {
      if (!isTemporaryLocalPreview) {
        sanitizeFlightData(CURRENT_DAYS_DATA);
        localStorage.setItem(STORAGE_KEY_SCHEDULE, JSON.stringify(CURRENT_DAYS_DATA));
        localStorage.setItem(STORAGE_KEY_UNSCHEDULED, JSON.stringify(CURRENT_UNSCHEDULED_PLACES));
        localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(COMPLETED_SPOTS));

        if (pushToCloudSync) {
          pushScheduleToCloud();
        }
      }
    }

    /* ==========================================================================
       3. RENDERING ENGINE
       ========================================================================== */
    function renderAll() {
      renderDaysSlides();
      renderUnscheduledSlide();
      renderMasterListSlide();
      updateTabStyles();
      if (window.lucide) lucide.createIcons();
    }

    function renderDaysSlides() {
      CURRENT_DAYS_DATA.forEach((day, index) => {
        const slide = document.getElementById(`slide-d${day.dayNum}`);
        if (!slide) return;

        const totalSpots = day.spots.length;
        const completedCount = day.spots.filter(s => COMPLETED_SPOTS.includes(s.id)).length;
        const percent = totalSpots > 0 ? Math.round((completedCount / totalSpots) * 100) : 0;

        let spotsHtml = "";
        if (day.spots.length === 0) {
          spotsHtml = `
            <div class="bg-white rounded-3xl p-6 text-center text-slate-400 border border-slate-200">
              <i data-lucide="map-pin-off" class="w-8 h-8 mx-auto mb-1 text-slate-300"></i>
              <p class="text-xs">本日尚無排定景點</p>
              <p class="text-[11px] text-slate-400 mt-0.5">可由「未排入景點」分頁點選排入！</p>
            </div>
          `;
        } else {
          spotsHtml = day.spots.map((spot, sIdx) => {
            const isDone = COMPLETED_SPOTS.includes(spot.id);
            return `
              <div class="bg-white rounded-3xl p-3.5 shadow-sm border border-slate-200/90 space-y-2 relative transition ${isDone ? 'opacity-60 bg-slate-50' : ''}">
                <div class="flex items-start justify-between gap-2">
                  <div class="flex items-center gap-1.5 min-w-0">
                    <button onclick="toggleSpotDone('${spot.id}')" class="p-1 rounded-xl ${isDone ? 'text-emerald-600 bg-emerald-50' : 'text-slate-300 hover:text-slate-500'} shrink-0" title="標記完成">
                      <i data-lucide="${isDone ? 'check-circle-2' : 'circle'}" class="w-4 h-4"></i>
                    </button>
                    <span class="text-[10px] font-bold px-1.5 py-0.2 rounded-md bg-sky-100 text-sky-800 shrink-0">${spot.cat || '景點'}</span>
                    <span class="text-[11px] font-bold text-sky-600 truncate">${spot.time || '彈性時段'}</span>
                  </div>

                  <!-- Admin Tools: Up, Down, Edit, Delete -->
                  ${isAdmin ? `
                    <div class="flex items-center gap-1 shrink-0">
                      ${sIdx > 0 ? `<button onclick="moveSpotOrder(${index}, ${sIdx}, -1)" class="p-1 text-slate-400 hover:text-sky-600 rounded-lg hover:bg-slate-100" title="上移"><i data-lucide="arrow-up" class="w-3.5 h-3.5"></i></button>` : ''}

    /* ==========================================================================
       4. CAROUSEL & NAVIGATION TABS
       ========================================================================== */
    function switchTab(index) {
      currentTabIndex = index;
      const track = document.getElementById("carousel-track");
      if (track) {
        track.style.transform = `translateX(-${index * 100}%)`;
      }
      updateTabStyles();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function updateTabStyles() {
      const btns = document.querySelectorAll(".tab-btn");
      btns.forEach((btn, idx) => {
        if (idx === currentTabIndex) {
          btn.className = "tab-btn px-3 py-1.5 rounded-xl bg-white text-sky-800 font-bold shadow-sm shrink-0 transition flex items-center gap-1";
        } else {
          btn.className = "tab-btn px-3 py-1.5 rounded-xl text-sky-100 hover:bg-white/10 shrink-0 transition flex items-center gap-1";
        }
      });
    }

    // Touch Swipe Gesture on Carousel
    let startX = 0;
    let currentX = 0;
    let isTouching = false;
    const trackEl = document.getElementById("carousel-track");

    if (trackEl) {
      trackEl.addEventListener("touchstart", (e) => {
        startX = e.touches[0].clientX;
        currentX = startX;
        isTouching = true;
      }, { passive: true });

      trackEl.addEventListener("touchmove", (e) => {
        if (!isTouching) return;
        currentX = e.touches[0].clientX;
      }, { passive: true });

      trackEl.addEventListener("touchend", () => {
        if (!isTouching) return;
        isTouching = false;
        const diffX = currentX - startX;
        if (diffX < -50 && currentTabIndex < 6) {
          switchTab(currentTabIndex + 1);
        } else if (diffX > 50 && currentTabIndex > 0) {
          switchTab(currentTabIndex - 1);
        }
      });
    }

        modal.classList.add("hidden");

    function verifyAdminPin() {
      const pin = document.getElementById("admin-pin-input")?.value;
      if (pin === "0000") {

    function moveSpotOrder(dayIndex, spotIndex, direction) {
      if (!isAdmin) return;
      const spots = CURRENT_DAYS_DATA[dayIndex].spots;
      const targetIdx = spotIndex + direction;
      if (targetIdx < 0 || targetIdx >= spots.length) return;

      const temp = spots[spotIndex];
      spots[spotIndex] = spots[targetIdx];
      spots[targetIdx] = temp;

      saveCurrentState(true);
      renderAll();
      alertToast("已調整景點順序！");
    }

    function toggleSpotDone(id) {
      if (COMPLETED_SPOTS.includes(id)) {
        COMPLETED_SPOTS = COMPLETED_SPOTS.filter(s => s !== id);
      } else {
        COMPLETED_SPOTS.push(id);
      }
      saveCurrentState(true);
      renderAll();
    }

    function copyNavigationText(text) {
      navigator.clipboard.writeText(text).then(() => {
        alertToast(`已複製【${text}】！`);
      }).catch(() => {
        alertToast("複製成功！");
      });

    /* ==========================================================================
       6. SCHEDULE & REPLACEMENT MODAL LOGIC
       ========================================================================== */
    let currentSchedulingPlaceIdx = null;
    let scheduleMode = "insert"; // 'insert' or 'replace'

    function requestScheduleSpot(idx) {
      if (!isAdmin) {
        alertToast("🔒 需管理員權限才能排入行程！");
        openAdminPinModal();
        return;
      }
      currentSchedulingPlaceIdx = idx;
      const place = CURRENT_UNSCHEDULED_PLACES[idx];
      document.getElementById("schedule-modal-spot-name").innerText = place.name;
      document.getElementById("schedule-spot-time").value = "11:00 - 12:30";

      setScheduleMode("insert");
      updateReplaceDropdownOptions();

      const modal = document.getElementById("schedule-spot-modal");
      modal.classList.remove("hidden");
      modal.classList.add("flex");
    }

    function closeScheduleModal() {
      const modal = document.getElementById("schedule-spot-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      currentSchedulingPlaceIdx = null;
    }

    function setScheduleMode(mode) {
      scheduleMode = mode;
      const insertBtn = document.getElementById("mode-btn-insert");
      const replaceBtn = document.getElementById("mode-btn-replace");
      const replaceGroup = document.getElementById("replace-spot-group");
      const importTimeBtn = document.getElementById("btn-import-replaced-time");

      if (mode === "insert") {
        insertBtn.className = "py-2 rounded-xl border border-sky-600 bg-sky-50 text-sky-700 font-bold";
        replaceBtn.className = "py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-bold";
        replaceGroup.classList.add("hidden");
        if (importTimeBtn) importTimeBtn.classList.add("hidden");
      } else {
        replaceBtn.className = "py-2 rounded-xl border border-sky-600 bg-sky-50 text-sky-700 font-bold";
        insertBtn.className = "py-2 rounded-xl border border-slate-200 bg-white text-slate-600 font-bold";
        replaceGroup.classList.remove("hidden");
        if (importTimeBtn) importTimeBtn.classList.remove("hidden");
        updateReplaceDropdownOptions();
        importReplacedSpotTime();
      }
    }

    function onScheduleTargetDayChange() {
      if (scheduleMode === "replace") {
        updateReplaceDropdownOptions();
        importReplacedSpotTime();
      }
    }

    function updateReplaceDropdownOptions() {
      const dayIndex = parseInt(document.getElementById("schedule-target-day").value);
      const sel = document.getElementById("schedule-replace-target");
      const spots = CURRENT_DAYS_DATA[dayIndex].spots;

      if (spots.length === 0) {
        sel.innerHTML = `<option value="">(此日目前無現有景點可替換)</option>`;
        return;
      }

      sel.innerHTML = spots.map((s, idx) => `
        <option value="${idx}">[${s.time}] ${s.name}</option>
      `).join("");
    }

    function onReplaceTargetSpotChange() {
      importReplacedSpotTime();
    }

    function importReplacedSpotTime() {
      const dayIndex = parseInt(document.getElementById("schedule-target-day").value);
      const sel = document.getElementById("schedule-replace-target");
      const spotIdx = parseInt(sel?.value);
      const spots = CURRENT_DAYS_DATA[dayIndex]?.spots;

      if (spots && !isNaN(spotIdx) && spots[spotIdx]) {
        const timeVal = spots[spotIdx].time;
        document.getElementById("schedule-spot-time").value = timeVal;
        alertToast(`🕒 已帶入【${spots[spotIdx].name}】時段：${timeVal}`);
      }
    }

    function confirmScheduleSpot() {
      if (currentSchedulingPlaceIdx === null) return;
      const dayIndex = parseInt(document.getElementById("schedule-target-day").value);
      const timeVal = document.getElementById("schedule-spot-time").value.trim() || "彈性時段";
      const place = CURRENT_UNSCHEDULED_PLACES[currentSchedulingPlaceIdx];

      const newSpot = {
        id: `s-${Date.now()}`,
        time: timeVal,
        name: place.name,
        cat: place.cat || "景點",
        note: place.note || "",
        mapUrl: place.mapUrl || `https://maps.google.com/?q=${encodeURIComponent(place.name)}`
      };

      if (scheduleMode === "replace") {
        const sel = document.getElementById("schedule-replace-target");
        const replaceIdx = parseInt(sel.value);
        if (isNaN(replaceIdx) || !CURRENT_DAYS_DATA[dayIndex].spots[replaceIdx]) {
          alertToast("請選擇要替換的景點！");
          return;
        }

        const oldSpot = CURRENT_DAYS_DATA[dayIndex].spots[replaceIdx];
        CURRENT_DAYS_DATA[dayIndex].spots[replaceIdx] = newSpot;

        // Auto move replaced spot into unscheduled places
        CURRENT_UNSCHEDULED_PLACES.push({
          id: `u-${Date.now()}`,
          name: oldSpot.name,
          cat: oldSpot.cat || "備選",
          note: oldSpot.note || "",
          mapUrl: oldSpot.mapUrl || ""
        });

        CURRENT_UNSCHEDULED_PLACES.splice(currentSchedulingPlaceIdx, 1);
        alertToast(`✅ 已替換【${oldSpot.name}】，原景點已移至備用庫！`);
      } else {
        CURRENT_DAYS_DATA[dayIndex].spots.push(newSpot);
        CURRENT_UNSCHEDULED_PLACES.splice(currentSchedulingPlaceIdx, 1);
        alertToast(`✅ 已排入 Day ${dayIndex + 1} 行程！`);
      }

      saveCurrentState(true);
      closeScheduleModal();
      switchTab(dayIndex);
      renderAll();
    }

      const modal = document.getElementById("edit-spot-modal");
      modal.classList.add("hidden");
      modal.classList.remove("flex");
      editingContext = null;
    }

    function confirmSaveSpotEdit() {
      const name = document.getElementById("edit-spot-name")?.value.trim();
      const cat = document.getElementById("edit-spot-cat")?.value.trim() || "景點";
      const time = document.getElementById("edit-spot-time")?.value.trim();
      const mapUrl = document.getElementById("edit-spot-map")?.value.trim();
      const note = document.getElementById("edit-spot-note")?.value.trim();

      if (!name) {
        alertToast("請輸入地點名稱！");
        return;
      }

      if (editingContext.type === "new_unscheduled") {
        CURRENT_UNSCHEDULED_PLACES.push({
          id: `u-${Date.now()}`,
          name,
          cat,
          note,
          mapUrl: mapUrl || `https://maps.google.com/?q=${encodeURIComponent(name)}`
        });
        alertToast(`✅ 已新增【${name}】至未排入景點！`);
      } else if (editingContext.type === "edit_day_spot") {
        const { dayIndex, spotIndex } = editingContext;
        const target = CURRENT_DAYS_DATA[dayIndex].spots[spotIndex];
        target.name = name;
        target.cat = cat;
        if (time) target.time = time;
        target.mapUrl = mapUrl || target.mapUrl;
        target.note = note;
        alertToast(`✅ 已更新【${name}】！`);
      }

      saveCurrentState(true);
      closeEditSpotModal();
      renderAll();
    }

    function deleteSpot(dayIndex, spotIndex) {
      if (!isAdmin) return;
      const spot = CURRENT_DAYS_DATA[dayIndex].spots[spotIndex];
      CURRENT_DAYS_DATA[dayIndex].spots.splice(spotIndex, 1);
      saveCurrentState(true);
      renderAll();
      alertToast(`已刪除【${spot.name}】！`);
    }

    function deleteUnscheduledPlace(idx) {
      if (!isAdmin) return;
      const place = CURRENT_UNSCHEDULED_PLACES[idx];
      CURRENT_UNSCHEDULED_PLACES.splice(idx, 1);
      saveCurrentState(true);
      renderAll();
      alertToast(`已移除【${place.name}】！`);
    }

    function convertJpyToTwd() {
      const jpyVal = parseFloat(document.getElementById("calc-input-jpy")?.value) || 0;
      const twdInput = document.getElementById("calc-input-twd");
      const twdVal = Math.round(jpyVal * currentLiveRate);
      if (twdInput) twdInput.value = twdVal > 0 ? twdVal : "";

      const fee = Math.round(twdVal * 0.015);
      const total = twdVal + fee;
      document.getElementById("calc-card-fee-display").innerText = `NT$ ${fee.toLocaleString()}`;
      document.getElementById("calc-card-total-display").innerText = `NT$ ${total.toLocaleString()}`;
    }

    function convertTwdToJpy() {
      const twdVal = parseFloat(document.getElementById("calc-input-twd")?.value) || 0;
      const jpyInput = document.getElementById("calc-input-jpy");
      const jpyVal = Math.round(twdVal / currentLiveRate);
      if (jpyInput) jpyInput.value = jpyVal > 0 ? jpyVal : "";

      const fee = Math.round(twdVal * 0.015);
      const total = twdVal + fee;
      document.getElementById("calc-card-fee-display").innerText = `NT$ ${fee.toLocaleString()}`;
      document.getElementById("calc-card-total-display").innerText = `NT$ ${total.toLocaleString()}`;
    }

    function quickSetJpy(val) {
      const input = document.getElementById("calc-input-jpy");
      if (input) {
        input.value = val;
        convertJpyToTwd();
      }
    }

    async function fetchLiveExchangeRate(isManual = false) {
      const icon = document.getElementById("modal-rate-refresh-icon");
      if (icon) icon.classList.add("animate-spin");

      try {
        const res = await fetch("https://open.er-api.com/v6/latest/JPY");
        const data = await res.json();
        if (data && data.rates && data.rates.TWD) {
          currentLiveRate = parseFloat(data.rates.TWD.toFixed(4));
          const disp = document.getElementById("modal-rate-display");
          if (disp) disp.innerText = currentLiveRate;
          convertJpyToTwd();
          if (isManual) alertToast(`即時匯率已更新：1 JPY ≈ ${currentLiveRate} TWD`);
        }
      } catch (err) {
        console.warn("Rate fetch error:", err);
      } finally {
        if (icon) icon.classList.remove("animate-spin");
      }
    }

    function alertToast(msg) {
      const toast = document.getElementById("notice-toast");
      const text = document.getElementById("notice-toast-text");
      if (!toast || !text) return;

      text.innerText = msg;
      toast.classList.remove("opacity-0", "-translate-y-2");
      toast.classList.add("opacity-100", "translate-y-0");

      setTimeout(() => {
        toast.classList.remove("opacity-100", "translate-y-0");
        toast.classList.add("opacity-0", "-translate-y-2");
      }, 2500);
    }

    /* ==========================================================================
       10. FIREBASE REAL-TIME CLOUD SYNC
       ========================================================================== */
    const DEFAULT_FIREBASE_CONFIG = {
      apiKey: "AIzaSyCRgoBOwtGRQyvCj3huinnhwB4Pzv6Nv_o",
      authDomain: "okinawa-new-year-trip.firebaseapp.com",
      projectId: "okinawa-new-year-trip",
      storageBucket: "okinawa-new-year-trip.firebasestorage.app",
      messagingSenderId: "263791427961",
      appId: "1:263791427961:web:52f7d410b02e1fa194afa8",
      measurementId: "G-ZM6TJKBZ9T"
    };

    let fbApp = null;
    let fbDb = null;
    let fbAuth = null;
    let fbUnsubscribe = null;
    const currentRoomId = localStorage.getItem("okinawa_fb_room") || "okinawa2027";

    function initFirebaseClient() {
      const storedConfig = localStorage.getItem("okinawa_fb_config");
      const config = storedConfig ? JSON.parse(storedConfig) : DEFAULT_FIREBASE_CONFIG;

      if (!window.FirebaseModule) return;

      try {
        const { initializeApp, getFirestore, getAuth, signInAnonymously } = window.FirebaseModule;
        if (!fbApp) fbApp = initializeApp(config);
        fbDb = getFirestore(fbApp);
        fbAuth = getAuth(fbApp);

        signInAnonymously(fbAuth).then(() => {
          listenToFirestoreChanges();
        }).catch(() => {
          listenToFirestoreChanges();
        });
      } catch (err) {
        console.error("Firebase init error:", err);
      }
    }

    function listenToFirestoreChanges() {
      if (!fbDb || !window.FirebaseModule) return;
      const { doc, onSnapshot } = window.FirebaseModule;

      if (fbUnsubscribe) fbUnsubscribe();

      const docRef = doc(fbDb, "trip_schedules", currentRoomId);
      fbUnsubscribe = onSnapshot(docRef, (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          let shouldReRender = false;

          if (data && data.days) {
            CURRENT_DAYS_DATA = data.days;
            sanitizeFlightData(CURRENT_DAYS_DATA);
            shouldReRender = true;
          }
          if (data && data.unscheduled) {
            CURRENT_UNSCHEDULED_PLACES = data.unscheduled;
            shouldReRender = true;
          }
          if (data && data.completed) {
            COMPLETED_SPOTS = data.completed;
            shouldReRender = true;
          }

          if (shouldReRender && !isTemporaryLocalPreview) {
            localStorage.setItem(STORAGE_KEY_SCHEDULE, JSON.stringify(CURRENT_DAYS_DATA));
            localStorage.setItem(STORAGE_KEY_UNSCHEDULED, JSON.stringify(CURRENT_UNSCHEDULED_PLACES));
            localStorage.setItem(STORAGE_KEY_COMPLETED, JSON.stringify(COMPLETED_SPOTS));
            renderAll();
          }
        }
      });
    }

    async function pushScheduleToCloud() {
      if (fbDb && window.FirebaseModule) {
        try {
          sanitizeFlightData(CURRENT_DAYS_DATA);
          const { doc, setDoc } = window.FirebaseModule;
          const docRef = doc(fbDb, "trip_schedules", currentRoomId);
          await setDoc(docRef, {
            days: CURRENT_DAYS_DATA,
            unscheduled: CURRENT_UNSCHEDULED_PLACES,
            completed: COMPLETED_SPOTS,
            updatedAt: new Date().toISOString()
          }, { merge: true });
        } catch (e) {
          console.warn("Firebase save error:", e);
        }
      }

      if (window.BroadcastChannel) {
        try {
          const bc = new BroadcastChannel(`okinawa_channel_${currentRoomId}`);
          bc.postMessage({ type: 'SCHEDULE_UPDATE', data: { days: CURRENT_DAYS_DATA, unscheduled: CURRENT_UNSCHEDULED_PLACES } });
        } catch (e) {}
      }
    }

    /* ==========================================================================
       11. DOM BOOTSTRAP
       ========================================================================== */
    function initializeApp() {
      renderAll();
      fetchLiveExchangeRate();
      setTimeout(initFirebaseClient, 500);
      if (window.lucide) lucide.createIcons();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initializeApp);
    } else {
      initializeApp();
    }
  </script>
</body>
